# Application Configuration
spring.application.name=smartreview-ai
app.base-url=http://10.76.125.212:5173
server.address=0.0.0.0
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartreview_ai
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini API Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini Model
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Response Variation
spring.ai.google.genai.chat.temperature=0.7

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=15m

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
